# Single-executable-application (SEA) release pipeline.
#
# Every tag push (v*) presses ruby_ast_gen into self-contained native binaries
# with tebako <https://tebako.org> — the CRuby runtime, the gem set (parser +
# prism with its native extension) and the application ride inside one file per
# platform, so consumers download a binary and run it with no Ruby (and no
# Java) installed. The JRuby-jar flow in the README remains; these binaries are
# the distribution that needs nothing but the OS.
#
# Legs and why they are shaped this way:
#   - linux-gnu:  pressed in an ubuntu:20.04 container, so prism's extension
#     links against glibc 2.31 rather than the runner's 2.39. The result runs
#     on Ubuntu 20.04+, Debian 11+ and RHEL 9+; the tebako runtime itself needs
#     GLIBC_2.30, which rules out RHEL 8 (2.28). Ubuntu 20.04 is past standard
#     support; it is used only as a glibc floor, and the image is pinned by
#     digest. Toolchain MUST be
#     clang: tebako's runtime SDK embeds the compiler flags of its build farm
#     (-fdeclspec, clang-18) in RbConfig, and gcc rejects them, so cc is
#     repointed at clang before pressing.
#   - linux-musl: pressed inside an alpine:3.21 container driven by docker run
#     from a glibc host — node-based actions cannot run on musl (the same shape
#     tebako's own release pipeline uses). The result runs on Alpine and any
#     musl system; the gnu binaries run on glibc distros (verified on
#     Ubuntu 20.04 / glibc 2.31).
#   - macos: arm64 on the current runner, x86_64 on macos-15-intel (the last
#     Intel image GitHub ships, available until ~Aug 2027). build/sea.sh sets
#     MACOSX_DEPLOYMENT_TARGET=14.0 so prism's extension does not inherit the
#     runner's macOS version as its minimum.
#   - windows: ucrt64 (x64), EXPERIMENTAL and unpublished. With tebako v2.8.77
#     the press compiles prism's native extension again (the tamatebako/tebako
#     #753 fix chain is in the driver), given the MSYS2 ucrt64 toolchain this
#     workflow installs and the SDK config.h patch build/sea.ps1 applies (see
#     its header). SEA_BUNDLED_PRISM=1 remains available to press without a
#     compiler, using the runtime's prism 1.8.1 instead of ~> 1.9; tags always
#     press the native build, because a release must not ship an older prism
#     than the gem. The leg still blocks nothing (continue-on-error).
#
# UPX: attempted-but-not-shipped. tebako packages carry appended image slots
# after the ELF container; UPX rewrites the ELF and shifts the slots, so the
# compressed binary fails build/sea.sh's verification and the script falls back
# to the uncompressed file. The opt-in input stays so a tebako release that
# relocates its slots turns compression on without further changes here.
#
# Triggers: a tag publishes; workflow_dispatch and any pull request touching the
# press machinery are build-only dry runs of the whole matrix (artifacts, no
# release). Every leg is therefore proven buildable before a tag exists.
name: Release

on:
  push:
    tags:
      - "v*"
  # A pull request that touches the press machinery builds the WHOLE matrix and
  # runs each leg's smoke test. Deliberately not a cheaper single leg: the only
  # thing that proves a platform's binary is buildable is building it, and the
  # alternative is discovering a broken leg at tag time, when the release is
  # already half-published. The path filter keeps this off ordinary PRs, so the
  # cost lands only on changes that can actually break a press.
  pull_request:
    branches:
      - main
    paths:
      - "build/**"
      - "sea/**"
      - "exe/**"
      - "Gemfile"
      - ".github/workflows/release.yaml"
  workflow_dispatch:
    inputs:
      sea_ruby:
        description: "CRuby runtime pressed into the binaries"
        required: false
        default: "4.0.7"
      tebako_version:
        description: "tebako release used for pressing (spike runs; tags use the pinned default)"
        required: false
        default: "v2.8.77"
      upx:
        description: "Attempt UPX compression on the linux-gnu binaries (falls back automatically)"
        required: false
        type: boolean
        default: false

# One run per ref: a re-pushed tag serializes behind its in-flight run instead
# of racing the same release's asset set (uploads clobber).
concurrency:
  group: release-${{ github.ref_name }}
  # A superseded pull-request press is dead work; a re-pushed tag must not
  # race its own release's asset set.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEA_RUBY_VERSION: ${{ github.event.inputs.sea_ruby || '4.0.7' }}
  TEBAKO_VERSION: ${{ github.event.inputs.tebako_version || 'v2.8.77' }}

permissions:
  contents: write

jobs:
  sea-linux-gnu:
    name: SEA linux-gnu ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pressed inside ubuntu:20.04 (glibc 2.31), not on the runner: prism's native
      # extension is compiled at press time against the BUILD host's glibc. Pressed
      # on ubuntu-24.04 it needs GLIBC_2.33, fails to load on Ubuntu 20.04 and
      # Debian 11, and ruby_ast_gen then silently falls back to the parser gem's
      # Ruby 3.3 grammar. sea.sh's smoke test, run inside the container, checks
      # that the prism backend and the pinned prism version load there.
      # cc is repointed at clang for the reason in the header comment.
      - name: Press the executable (ubuntu:20.04 container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e SEA_RUBY_VERSION -e TEBAKO_VERSION -e SEA_UPX \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq clang build-essential cmake upx-ucl curl ca-certificates file
              ln -sf "$(command -v clang)" /usr/local/bin/cc
              cc --version | grep -qi clang || { echo "cc is not clang" >&2; exit 1; }
              mkdir -p /tmp/sea-home && chown "$HOST_UID:$HOST_GID" /tmp/sea-home
              setpriv --reuid "$HOST_UID" --regid "$HOST_GID" --clear-groups \
                env HOME=/tmp/sea-home ./build/sea.sh
            '
        env:
          SEA_UPX: ${{ github.event_name == 'workflow_dispatch' && inputs.upx && '1' || '0' }}
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-linux-gnu-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  sea-linux-musl:
    name: SEA linux-musl ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The press runs in the container; the host only supplies docker. The
      # image's own arch matches the runner, and the musl runtime pressed there
      # is what alpine/musl users download. SEA_RUBY_VERSION/TEBAKO_VERSION
      # are passed with -e because the workflow-level env: does not cross the
      # container boundary — without them a dispatch's sea_ruby input would be
      # silently ignored on this leg. The press itself runs as the host's
      # uid/gid (apk as root, then su-exec): a root press leaves root-owned
      # files in the checkout's dist/, which the runner user cannot clean up.
      - name: Press the executable (alpine container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e SEA_RUBY_VERSION -e TEBAKO_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd sh -c '
              set -e
              apk add --no-cache -q curl ca-certificates build-base cmake clang file su-exec bash
              # The Ruby configure step (run while tebako provisions the SDK) uses bash
              # substitutions that busybox sh rejects with "bad substitution".
              ln -sf /bin/bash /bin/sh
              ln -sf /usr/bin/clang /usr/bin/cc
              cc --version | grep -q clang || { echo "cc is not clang" >&2; exit 1; }
              mkdir -p /tmp/sea-home && chown "$HOST_UID:$HOST_GID" /tmp/sea-home
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/sea-home ./build/sea.sh
            '
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-linux-musl-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  sea-macos:
    name: SEA macos ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-26 }
          - { arch: x86_64, os: macos-15-intel }
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the press toolchain
        run: brew install cmake
      - name: Press the executable
        run: ./build/sea.sh
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Experimental and deliberately non-blocking (continue-on-error, absent from
  # the release job's needs:). Every run presses the native prism ~> 1.9 build:
  # the MSYS2 ucrt64 toolchain is installed below, and build/sea.ps1 patches
  # the SDK config.h that tebako-runtime-ruby v0.2.38 broke for mingw builds
  # (its header has the details). The .exe artifact therefore exists on every
  # run again; publishing it is still a deliberate no (the release job's
  # download pattern and asset count stay at six until that decision is made,
  # and the spike's "verify on a real x64 Windows machine" recommendation
  # stands: the VM numbers are x64-under-emulation).
  sea-windows:
    name: SEA windows-ucrt64 (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The native prism build needs the ucrt64 ABI gcc (the runtime is ucrt)
      # and the MSYS make, which resolves the '/C/...' prerequisite paths mkmf
      # writes; mingw32-make cannot. ucrt64\bin goes first on PATH so it wins
      # over the runner image's legacy C:\mingw64 (msvcrt) gcc.
      - name: Install the MSYS2 ucrt64 toolchain
        shell: pwsh
        run: |
          choco install -y --no-progress msys2
          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-gcc make"
      - name: Press the executable
        shell: pwsh
        env:
          SEA_BUNDLED_PRISM: "0"
        run: |
          $env:PATH = "C:\tools\msys64\ucrt64\bin;C:\tools\msys64\usr\bin;$env:PATH"
          ./build/sea.ps1
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-windows-ucrt64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    # sea-windows is deliberately absent: it is experimental (see the job's
    # comment) and must never hold up or fail a release.
    needs: [sea-linux-gnu, sea-linux-musl, sea-macos]
    # A dispatch is a build-only dry run; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard the tag against the gem version
        run: |
          VERSION=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib/ruby_ast_gen/version.rb)
          TAG="${GITHUB_REF_NAME}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match the gem version v$VERSION; refusing to publish mismatched binaries." >&2
            exit 1
          fi
      - name: Collect the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Only the six legs this release publishes; the experimental Windows
          # artifact is never picked up, even on the run where it succeeds.
          pattern: sea-{linux,macos}-*
          path: dist
          merge-multiple: true
      - name: Check the asset set is complete
        working-directory: dist
        run: |
          # A mistyped pattern above would otherwise publish an empty release.
          count=$(ls ruby_ast_gen-*-* 2>/dev/null | grep -vc '\.sha256$' || true)
          [ "$count" -eq 6 ] || {
            echo "Expected 6 binaries, found $count:" >&2; ls -l >&2; exit 1;
          }
      - name: Assemble the checksum manifest
        working-directory: dist
        run: cat *.sha256 | sed 's/  .*\//  /' > SHA256SUMS
      - name: Write the release notes
        run: |
          VERSION=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib/ruby_ast_gen/version.rb)
          mkdir -p /tmp/notes
          {
            echo "Self-contained single executables for \`ruby_ast_gen\` $GITHUB_REF_NAME — no Ruby (or Java) required on the machine that runs them."
            echo
            echo "Each binary embeds the CRuby runtime and the parser/prism gems, including prism's native extension. The parser backend is selected by grammar capability, exactly as in the gem: check any downloaded binary with \`./ruby_ast_gen-$VERSION-linux-gnu-x86_64 --parser-info\`."
            echo
            echo "| Asset | Runs on |"
            echo "| --- | --- |"
            echo "| \`ruby_ast_gen-$VERSION-linux-gnu-x86_64\` | x86_64 Linux, glibc 2.31 or newer (Ubuntu 20.04+, Debian 11+, RHEL 9+) |"
            echo "| \`ruby_ast_gen-$VERSION-linux-gnu-arm64\` | arm64 Linux, glibc 2.31 or newer |"
            echo "| \`ruby_ast_gen-$VERSION-linux-musl-x86_64\` | x86_64 Alpine/musl and distroless-musl |"
            echo "| \`ruby_ast_gen-$VERSION-linux-musl-arm64\` | arm64 Alpine/musl |"
            echo "| \`ruby_ast_gen-$VERSION-macos-arm64\` | Apple Silicon macOS 14 or newer |"
            echo "| \`ruby_ast_gen-$VERSION-macos-x86_64\` | Intel macOS 14 or newer |"
            echo
            echo "On first run each binary unpacks its runtime (about 80 to 150 MB) into \`\$TEBAKO_HOME\`, \`~/.tebako\` by default, and at run time it extracts prism's native extension into \`\$TMPDIR\`. Both directories must be writable and allow executing files. With a \`noexec\` \`/tmp\`, set \`TMPDIR\` to another directory; otherwise prism does not load and the binary falls back to an older grammar, printing a warning on stderr."
            echo
            echo "Windows is not published yet: tebako cannot build prism's native extension during a Windows press. Windows users should keep using the gem or the JRuby jar."
            echo
            echo '```bash'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ruby_ast_gen-${VERSION}-linux-gnu-x86_64"
            echo "chmod +x ruby_ast_gen-${VERSION}-linux-gnu-x86_64"
            echo "./ruby_ast_gen-${VERSION}-linux-gnu-x86_64 -i <path> -o .ast"
            echo '```'
            echo
            echo "Checksums are in \`SHA256SUMS\` (and the per-file \`.sha256\` assets); verify with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "macOS note: the binaries are not notarized, so the first launch of a downloaded file needs Gatekeeper approval (right-click → Open, or \`xattr -d com.apple.quarantine <binary>\`)."
          } > /tmp/notes/notes.md
      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes/notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
